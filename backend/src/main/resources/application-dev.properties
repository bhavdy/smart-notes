# ── Application Properties (Development - H2 In-Memory DB) ──────────────
spring.application.name=smart-notes-backend
server.port=8080

# ── H2 In-Memory Database (Works without MySQL!) ─────────────────────────
spring.datasource.url=jdbc:h2:mem:smartnotes;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ── H2 Console (View DB in browser at http://localhost:8080/h2-console) ──
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ── JPA / Hibernate ────────────────────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ── Initialize Schema with seed data ──────────────────────────────────────
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-h2.sql

# ── JWT ────────────────────────────────────────────────────────────────────
jwt.secret=smartnotes_jwt_secret_key_minimum_32_chars_long!!
jwt.expiration.ms=86400000

# ── Swagger / OpenAPI ──────────────────────────────────────────────────────
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ── Logging ────────────────────────────────────────────────────────────────
logging.level.com.smartnotes=INFO
logging.level.org.springframework.security=WARN
